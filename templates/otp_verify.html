{% extends 'base.html' %}
{% block title %}OTP Verification — Dashboard{% endblock %}

{% block content %}
<style>
  body {
    background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Courier New', 'Segoe UI', monospace;
  }

  .otp-container {
    width: 100%;
    max-width: 400px;
    padding: 32px;
    background: linear-gradient(135deg, rgba(26, 31, 58, 0.8), rgba(30, 39, 73, 0.5));
    border: 1px solid rgba(0, 255, 255, 0.15);
    border-radius: 12px;
    backdrop-filter: blur(15px);
    box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
  }

  .otp-title {
    font-size: 28px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 2px;
    background: linear-gradient(135deg, #00ffff, #00ff88);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
    text-align: center;
  }

  .otp-subtitle {
    font-size: 12px;
    color: #00ff88;
    text-align: center;
    letter-spacing: 1px;
    margin-bottom: 24px;
    text-transform: uppercase;
  }

  .otp-info {
    font-size: 13px;
    color: #00ffff;
    text-align: center;
    margin-bottom: 20px;
    line-height: 1.5;
  }

  .form-group {
    margin-bottom: 16px;
  }

  .form-label {
    display: block;
    font-size: 12px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #00ffff;
    margin-bottom: 8px;
  }

  .form-input {
    width: 100%;
    padding: 12px 14px;
    background: rgba(0, 255, 255, 0.05);
    border: 1px solid rgba(0, 255, 255, 0.2);
    border-radius: 8px;
    color: #00ffff;
    font-family: 'Courier New', monospace;
    font-size: 18px;
    letter-spacing: 2px;
    text-align: center;
    transition: all 0.3s ease;
  }

  .form-input:focus {
    outline: none;
    border-color: #00ffff;
    box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
    background: rgba(0, 255, 255, 0.1);
  }

  .verify-btn {
    width: 100%;
    padding: 12px;
    background: linear-gradient(135deg, #00ff88, #00ffff);
    border: none;
    border-radius: 8px;
    color: #000;
    font-size: 14px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
  }

  .verify-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
  }

  .error-message {
    background: rgba(255, 0, 128, 0.15);
    border-left: 3px solid #ff0080;
    color: #ff6ba6;
    padding: 12px;
    border-radius: 6px;
    margin-bottom: 16px;
    font-size: 12px;
  }

  .resend-link {
    text-align: center;
    margin-top: 16px;
    font-size: 12px;
  }

  .resend-link a {
    color: #00ffff;
    text-decoration: none;
    cursor: pointer;
  }

  .resend-link a:hover {
    color: #00ff88;
  }
</style>

<div class="otp-container">
  <div class="otp-title">🔐 OTP VERIFY</div>
  <div class="otp-subtitle">Two-Factor Authentication</div>

  <div class="otp-info">
    An OTP has been sent to your email.<br>
    <strong>{{ masked_email }}</strong>
  </div>

  {% if error %}
  <div class="error-message">{{ error }}</div>
  {% endif %}

  <form method="POST">
    <div class="form-group">
      <label class="form-label">Enter 6-Digit OTP</label>
      <input type="text" name="otp" class="form-input" placeholder="000000" maxlength="6" pattern="[0-9]{6}" required autofocus>
    </div>

    <button type="submit" class="verify-btn">Verify OTP</button>
  </form>

  <div class="resend-link">
    <a href="{{ url_for('resend_otp') }}">Resend OTP</a>
  </div>
</div>
{% endblock %}
